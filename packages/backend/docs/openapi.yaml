    post:
      tags: [Communication]
      summary: Send message
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, recipientIds]
              properties:
                content:
                  type: string
                recipientIds:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Message sent

  /api/v1/communication/messages/{messageId}/read:
    patch:
      tags: [Communication]
      summary: Mark message as read
      security:
        - bearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message marked as read

  /api/v1/communication/announcements:
    get:
