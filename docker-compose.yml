services:
  postgres:
    image: postgres:16-alpine
    container_name: montessori-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: montessori_erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: montessori-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: montessori-backend
    restart: unless-stopped
    env_file:
      - packages/backend/.env
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend/src:/app/src
      - ./packages/backend/prisma:/app/prisma

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: montessori-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
