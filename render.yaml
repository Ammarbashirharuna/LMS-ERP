services:
  - type: web
    name: lms-erp-backend
    runtime: node
    plan: starter
    buildCommand: |
      npm install
      cd packages/backend
      mkdir -p node_modules/.bin node_modules/@prisma
      ln -sf ../../node_modules/.bin/prisma node_modules/.bin/prisma
      ln -sf ../../node_modules/@prisma/client node_modules/@prisma/client
      ln -sf ../../node_modules/.prisma node_modules/.prisma
      node_modules/.bin/prisma generate
      node_modules/.bin/prisma migrate deploy
    startCommand: cd packages/backend && npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lms-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        sync: false
        value: ""
      - key: PAYSTACK_SECRET_KEY
        sync: false
        value: ""
      - key: RESEND_API_KEY
        sync: false
        value: ""
    healthCheckPath: /api/v1/settings
    autoDeploy: true

  - type: web
    name: lms-erp-frontend
    runtime: static
    plan: starter
    buildCommand: |
      npm install
      cd packages/frontend
      npm install
      npm run build
    staticPublishPath: packages/frontend/dist
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
        value: ""

databases:
  - name: lms-erp-db
    plan: starter
    databaseName: lms_erp
    postgresMajorVersion: "16"
