services:
  - type: web
    name: lms-erp-backend
    runtime: node
    plan: starter
    buildCommand: bash build.sh
    startCommand: cd packages/backend && npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        sync: false
        value: ""
      - key: PAYSTACK_SECRET_KEY
        sync: false
        value: ""
      - key: RESEND_API_KEY
        sync: false
        value: ""
    healthCheckPath: /api/v1/settings
    autoDeploy: true

  - type: web
    name: lms-erp-frontend
    runtime: static
    plan: starter
    buildCommand: |
      npm install
      cd packages/frontend
      npm install
      npm run build
    staticPublishPath: packages/frontend/dist
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
        value: ""
